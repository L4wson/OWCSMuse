# Fly.io config for the API (the Dockerfile at the repository root). The frontend is on Vercel and ingest is the
# GitHub Actions workflow; neither runs here. See README "Deploying" for the first-deploy command sequence.
#
# Secrets (fly secrets set): DATABASE_URL only. The API never reads FACEIT_API_KEY or LIQUIPEDIA_API_KEY.

app = "owcsmuse-api"
primary_region = "sjc"            # San Jose; Supabase is us-west-2 (Oregon)

[build]
  dockerfile = "Dockerfile"

[deploy]
  # runs once per deploy in a temporary machine, with the app's secrets, before any machine is replaced
  release_command = "python -m owcsmuse migrate"

[env]
  PORT = "8000"                   # the image's CMD listens on $PORT; pinned so it always matches internal_port

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "off"      # always on: no cold start
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    method = "GET"
    path = "/healthz"             # liveness plus a database round trip: 503 when Postgres is unreachable
    interval = "30s"
    timeout = "5s"
    grace_period = "15s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
