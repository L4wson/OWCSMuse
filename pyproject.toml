[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "owcsmuse"
version = "0.1.0"
description = "OWCS Muse: FACEIT data ingestion layer for an Overwatch Champions Series stats warehouse"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "psycopg[binary]>=3.1",
    "pydantic>=2.5",
    "pydantic-settings>=2.2",
]

[project.optional-dependencies]
api = ["fastapi>=0.111", "uvicorn>=0.30"]
dev = ["pytest>=8", "ruff>=0.6", "fastapi>=0.111", "uvicorn>=0.30"]

[project.scripts]
owcsmuse = "owcsmuse.cli:main"

[tool.setuptools.packages.find]
include = ["owcsmuse*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["golden: end-to-end answers checked against independently derived values (own CI job)"]

# Lint for correctness, not for style: undefined and unused names, mutable
# defaults, except-without-type, loop-variable bugs. Line length and statement
# layout are left alone deliberately - a gate that fires on formatting stops
# being read, and this codebase's long lines are SQL and argparse tables that
# are clearer in one piece.
[tool.ruff]
line-length = 130
target-version = "py311"

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency markers belong in argument defaults; that is the idiom.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path", "fastapi.Body", "fastapi.Header"]

[tool.ruff.lint]
select = ["E", "F", "W", "B"]
ignore = [
    "E501",   # line length: see above
    "E702",   # `x = p.add_parser(...); x.add_argument(...)` reads as one unit in the CLI table
    "E741",   # `l` as a name: only ever a short loop variable here
]
