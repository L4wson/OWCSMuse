[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "owcsmuse"
version = "0.1.0"
description = "OWCS Muse: FACEIT data ingestion layer for an Overwatch Champions Series stats warehouse"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "psycopg[binary]>=3.1",
    "pydantic>=2.5",
    "pydantic-settings>=2.2",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
owcsmuse = "owcsmuse.cli:main"

[tool.setuptools.packages.find]
include = ["owcsmuse*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
