name: CI

on:
  push:
    branches: ["**"]
  pull_request:

env:
  PYTHON_VERSION: "3.11"

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check .

  tests:
    name: offline tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -e ".[dev]"
      # No OWCS_TEST_DATABASE_URL: the database suites skip, so this job proves
      # the parsers, classifier, limiter and query layer need neither network nor DB.
      - run: pytest -q

  integration:
    name: database tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: owcs
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      OWCS_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/owcs
      OWCS_TEST_SCHEMA: owcs_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -e ".[dev]"
      # the golden suite has its own job below
      - run: pytest -q -m "not golden"

  golden:
    name: golden answers
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: owcs
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      OWCS_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/owcs
      OWCS_GOLDEN_SCHEMA: owcs_golden
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -e ".[dev]"
      # Twenty real matches, the repository's own identity decisions, and 25 questions whose expected
      # answers were derived from the raw payloads. A failure means an answer changed; the message shows
      # expected against actual.
      - run: pytest -q -m golden tests/test_golden_answers.py

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      # The component tests mock the API; nothing here needs a service or a database.
      - run: npm test
      - run: npm run build

  consistency:
    name: consistency checks
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: owcs
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/owcs
      OWCS_DB_SCHEMA: owcs_fixture
      FACEIT_API_KEY: not-used-no-requests-are-made
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -e ".[dev]"
      # A real warehouse built from the captured fixtures, then the same command
      # that is run against production. Exit 1 on any discrepancy.
      - run: python tools/build_fixture_db.py
      - run: python -m owcsmuse --log-format text check
