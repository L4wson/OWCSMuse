name: Deploy API

# Deploys the API to Fly.io after CI passes on a push to main - never alongside CI, never from a pull request.
#
# workflow_run fires when the CI workflow finishes; the job runs only when that run was a push to main and every CI job
# passed, and it deploys exactly the commit CI tested (head_sha), not whatever main points at by the time it starts.
#
# fly.toml's release_command (`python -m owcsmuse migrate`) runs in a temporary machine from the new image, with the
# app's secrets, before any machine is replaced: if it exits non-zero the deploy stops there and the running machine
# keeps serving the previous version. Each migration is its own transaction (owcsmuse.db.migrate), so a failing file
# leaves the database as it was before that file; files before it in the same run stay applied.
#
# Repository secret (Settings > Secrets and variables > Actions):
#   FLY_API_TOKEN   a deploy token scoped to the app: `fly tokens create deploy -a owcsmuse-api`

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

concurrency:
  group: deploy-api            # one deploy at a time; a newer one waits rather than racing the release command
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: fly deploy
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: superfly/flyctl-actions/setup-flyctl@fc53c09e1bc3be6f54706524e3b82c4f462f77be   # 1.5
      - name: token present
        run: |
          [ -n "$FLY_API_TOKEN" ] || { echo "::error title=Missing secret::FLY_API_TOKEN is not set in Actions secrets"; exit 1; }
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      - name: deploy (release_command migrates first; a failed migration aborts the deploy)
        run: flyctl deploy --remote-only --config fly.toml
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      - name: health
        run: |
          for i in $(seq 1 12); do
            curl -fsS https://owcsmuse-api.fly.dev/healthz && exit 0
            sleep 5
          done
          echo "::error title=Unhealthy::the deploy finished but /healthz did not answer"; exit 1
